name: ProseBench tests

on:
  push:
    paths:
      - "prosebench/**"
      - ".github/workflows/prosebench-test.yml"
  pull_request:
    paths:
      - "prosebench/**"
      - ".github/workflows/prosebench-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prosebench
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: prosebench/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
