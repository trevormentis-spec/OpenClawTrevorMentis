<!DOCTYPE html>
<html style="height:100%"><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; }
  body {
    width: 1200px; height: 675px;
    background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
    font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #ffffff;
    padding: 40px 50px;
    display: flex;
    flex-direction: column;
  }
  .top-bar { display: flex; justify-content: space-between; margin-bottom: 16px; }
  .brand { font-size: 10pt; letter-spacing: 2px; color: #c9a84c; text-transform: uppercase; }
  .date { font-size: 10pt; color: #c9a84c; }
  .divider { width: 50px; height: 2px; background: #c9a84c; margin-bottom: 20px; }

  .content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .title { font-size: 20pt; font-weight: 700; line-height: 1.2; margin-bottom: 16px; }
  .judgment-list { list-style: none; }
  .judgment-item { font-size: 11pt; line-height: 1.4; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .judgment-item:last-child { border-bottom: none; }
  .kent-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .dot-almost_certain { background: #00b300; }
  .dot-likely { background: #99cc33; }
  .dot-probable { background: #cccc33; }
  .dot-even_chance { background: #cc9933; }
  .dot-unlikely { background: #cc6633; }

  .footer { padding-top: 12px; font-size: 8pt; color: #666; text-align: center; border-top: 1px solid rgba(255,255,255,0.08); }
</style>
</head><body>
<div class="top-bar">
  <div class="brand">Trevor Intelligence</div>
  <div class="date">{{ date }}</div>
</div>
<div class="divider"></div>
<div class="content">
  <div class="title">{{ title }}</div>
  <ul class="judgment-list">
    {% for j in judgments %}
    <li class="judgment-item">
      <span class="kent-dot dot-{{ j.kent_band | lower | replace(' ', '_') }}"></span>
      {{ j.claim }}
    </li>
    {% endfor %}
  </ul>
</div>
<div class="footer">trevorintel.com · Intelligence Briefing</div>
</body></html>
