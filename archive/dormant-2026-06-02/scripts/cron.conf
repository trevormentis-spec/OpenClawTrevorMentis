#!/bin/bash
# Cron integration for runtime self-healing
# 
# Install with:
#   crontab -l | cat - /home/ubuntu/.openclaw/workspace/scripts/cron.conf | crontab -
#
# Or add these lines to crontab:
#   */10 * * * * /home/ubuntu/.openclaw/workspace/scripts/runtime-health.sh
#   */30 * * * * /home/ubuntu/.openclaw/workspace/scripts/runtime-health.sh --report-only

# ── Runtime health (every 10 min) ──
*/10 * * * * /home/ubuntu/.openclaw/workspace/scripts/runtime-health.sh

# ── Health report (every 6 hours) ──
# Runtime: 0 6,12,18 * * * 
# Health report generation:
# 15 */6 * * * /home/ubuntu/.openclaw/workspace/scripts/runtime-health.sh --report-only
