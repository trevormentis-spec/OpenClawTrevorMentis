# Theme Requirements Map — Global Geopolitical Intelligence
#
# Maps query categories to required and recommended theme coverage.
# Used by analyst/themes_preflight.py before brief generation.
# Required themes MUST have substantive coverage in the output.

query_categories:
  # --- Geopolitical / Security ---
  geopolitical_intelligence_brief:
    required: [conflict_security, political_risk, international_relations]
    recommended: [economy_markets, cyber_digital, energy_climate]
    rationale_conflict_security: "Conflict dynamics, military postures, and security threats are core analytical outputs."
    rationale_political_risk: "Government stability, elections, policy shifts, and diplomatic moves drive geopolitical outcomes."
    rationale_international_relations: "Bilateral and multilateral relationships, alliances, and treaty dynamics."

  conflict_assessment:
    required: [conflict_security]
    recommended: [political_risk, international_relations, economy_markets]

  election_monitoring:
    required: [political_risk]
    recommended: [economy_markets, international_relations]

  energy_security:
    required: [energy_climate, political_risk]
    recommended: [economy_markets, conflict_security]

  cyber_threat:
    required: [cyber_digital, conflict_security]
    recommended: [political_risk, economy_markets]

  supply_chain_risk:
    required: [economy_markets, political_risk]
    recommended: [conflict_security, international_relations]

  maritime_security:
    required: [conflict_security, international_relations]
    recommended: [economy_markets, energy_climate]

  # Default — broad geopolitical coverage
  default:
    required: [conflict_security, political_risk, international_relations]
    recommended: [economy_markets]
    rationale_default: "Query category not resolved. Defaulting to broad geopolitical coverage."
