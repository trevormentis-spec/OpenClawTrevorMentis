# Theme Requirements: LEO Ground Stations
# Generated by topic_onboarding.py — Phase A2

themes:
  - name: infrastructure_operators
    description: >
      Track top GSaaS providers (KSAT, SSC, Leaf, Skynopy, Atlas, RBC, Infostellar, AWS, Viasat RTE),
      sovereign networks (NASA NEN, ESA Estrack, JAXA, ISRO, CNSA), site inventory and expansion plans,
      antenna counts and types, geographic coverage, polar and equatorial infrastructure build-out.
      Includes operator business models (owned vs federated vs marketplace), SLAs, and technology stack
      (SDR, FPGA, cloud-integrated).
    priority: high
    probes:
      - "Which operators are expanding fastest by site/antenna count?"
      - "What is the geographic coverage gap for each major constellation?"
      - "How are sovereign networks evolving their ground segment?"
      - "What is the rate of polar ground station buildout?"

  - name: industry_economics
    description: >
      GSaaS pricing models and trends (per-pass, per-Mbps, subscription), capacity utilization rates,
      revenue growth trajectories, M&A activity (EQT/Eutelsat sale-leaseback, Atlas/York, Azure exit),
      VC investment flows, funding rounds, valuation benchmarks, profitability timelines, market sizing
      by segment (LEO GSaaS, total ground station, cloud-integrated).
    priority: high
    probes:
      - "What is the implied per-antenna revenue for Tier-1 vs Tier-2 operators?"
      - "How does the EQT/Eutelsat $830M transaction affect asset valuations?"
      - "What is the breakeven timeline for VC-backed GSaaS operators?"
      - "Is VC investment in GSaaS accelerating or slowing?"

  - name: regulatory_compliance
    description: >
      FCC space bureau licensing updates, ITU-R regulatory framework for NGSO filings, spectrum
      allocation (S-band, X-band, Ka-band, V-band for feeder links), host country licensing regimes,
      ITAR/EAR export controls on ground station equipment, environmental review requirements for new
      sites, frequency coordination between constellations and terrestrial services.
    priority: medium
    probes:
      - "What FCC regulatory changes affect non-US operators providing services to US customers?"
      - "How is ITU-R processing the wave of NGSO filings for ground stations?"
      - "Which countries have the most favorable regulatory regimes for new ground stations?"
      - "Are ITAR restrictions constraining GSaaS operator site choices?"

  - name: security_resilience
    description: >
      Physical security assessment for LEO ground infrastructure following Concentric methodology:
      asset taxonomy (GES, SNP, TT&C, supporting infrastructure), 10-threat taxonomy (PA-01/02
      unauthorised access, PS-01/02 sabotage, PR-01 surveillance, PT-01 theft, PD-01 drone/UAS,
      PE-01 environmental, PC-01 civil unrest, PX-01 state-level), 5-phase assessment process
      (Orient → Context → Threat Assessment → Vulnerability Assessment → Risk Rating), 7-dimension
      Site Context Profile scoring (each 1-5), risk matrix (likelihood × consequence), architecture
      implications (bent-pipe vs regenerative ISL), and physical security control checklist (8 areas).
      Also covers cyber threats (RF jamming, spoofing, upstream data compromise), redundancy
      architectures, disaster recovery, and insurance coverage for ground segment risk.
    priority: high
    probes:
      - "What is the threat profile for RF jamming of polar ground stations?"
      - "How do operators handle upstream data chain security?"
      - "What is the physical security posture at remote/harsh environment sites using Concentric 7-dimension scoring?"
      - "Are there documented attacks on ground station infrastructure?"
      - "What is the 7-dimension Site Context Profile score for [site], and what likelihood × consequence risk rating does it produce?"
      - "Which sites in the register are scored Critical on the Concentric risk matrix?"
      - "How does transparent (bent-pipe) vs regenerative (ISL) architecture affect physical security risk scoring?"
      - "What counter-UAS capability exists at High/Critical-rated ground station sites?"
      - "How does the 129-site Concentric risk register compare to the 80-site physical security risk register?"

  - name: geopolitical_sovereignty
    description: >
      Host country risk assessment (expropriation, political instability, sanctions compliance), telecom
      sovereignty concerns (data residnecy requirements, national security reviews), Five Eyes intelligence
      access dynamics, Russia/China competition in ground segment, overseas territory basing (French
      DOM-TOM, UK overseas territories, Norwegian polar claims), strategic chokepoints (Svalbard, Troll,
      Andoya, Hawaii, Guam), BRI ground station investments.
    priority: medium
    probes:
      - "Which ground station sites are at highest expropriation risk?"
      - "How does the Svalbard Treaty affect KSAT's strategic position?"
      - "What is China's CNSA/BRI ground station network strategy?"
      - "How do sanctions affect Russian/Chinese access to western ground infrastructure?"

  - name: technology_evolution
    description: >
      Optical/laser communications ground terminals (Mynaric, Tesat, SpaceX laser crosslinks), inter-
      satellite links reducing ground station dependence, software-defined radio and FPGA evolution,
      multi-band antennas (S/X/Ka), edge computing at ground stations, automation and AI-driven pass
      scheduling, KSAT Hyper space-based relay, optical ground station networks, phased array antennas
      for LEO tracking.
    priority: medium
    probes:
      - "How quickly are optical ground stations being deployed?"
      - "Does ISL technology reduce or increase ground station demand over the next 5 years?"
      - "What is the adoption rate of SDR vs traditional RF chains?"
      - "How is edge computing changing ground station architectures?"

  - name: satellite_operator_dynamics
    description: >
      Constellation traffic patterns and ground segment demand (Starlink, OneWeb/Eutelsat, Kuiper/Amazon,
      Planet, Capella, Satellogic), customer concentration risk by GSaaS operator, contract duration
      and renewal rates, SLAs and uptime guarantees, constellation growth projections (12,000-34,400
      Starlink, 3,236 Kuiper, 648 OneWeb + Gen 2), multi-constellation passthrough requirements.
    priority: medium
    probes:
      - "What is the traffic share across the top 5 GSaaS operators?"
      - "Which constellation operators are diversifying their ground provider mix?"
      - "What are the SLA breach rates and trends?"
      - "How does Starlink's self-provided ground segment affect the GSaaS addressable market?"

  - name: insurance_risk_markets
    description: >
      Space insurance market capacity for ground segment, coverage availability for ground station
      assets (physical damage, business interruption, cyber), claims history for ground station losses,
      Lloyd's of London space underwriting capacity, premiums trends for space insurance broadly,
      parametric insurance products for satellite-ground links, Kessler syndrome implications for
      ground station business continuity, war risk and terrorism exclusions for ground sites.
    priority: low
    probes:
      - "What is the total insured value of commercial ground station assets globally?"
      - "Have there been any significant ground station insurance claims?"
      - "How is Lloyd's space syndicate capacity trending?"
      - "What parametric triggers exist for ground segment business interruption?"
