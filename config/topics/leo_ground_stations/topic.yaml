# Scope definition for scope_check.py
primary_scope: "LEO Ground Stations"
scope_description: >
  Analysis of LEO ground station infrastructure, operators, economics, security, regulation, geopolitics,
  and adjacent technologies. Specifically covers: GSaaS providers (AWS, KSAT, SSC, Leaf, Skynopy, Atlas,
  RBC, Infostellar, Viasat RTE), sovereign networks (NASA NEN, ESA Estrack, JAXA, ISRO, CNSA),
  geographic sites and their risk profiles, satellite operator dependencies (Starlink, Kuiper, OneWeb,
  Telesat, IRIS², Guowang, Qianfan), inter-satellite links and laser comms, Kessler/debris risk affecting
  ground station ops, insurance markets for space infrastructure, and FCC/ITU regulatory developments.

  Asset types in scope (per Concentric Physical Security Taxonomy):
  - Gateway Earth Stations (GES): primary ground stations hosting Ka/Ku-band phased array antenna
    arrays, radome enclosures, and fibre interconnects to IXPs
  - Satellite Network Portals (SNP): data processing and routing facilities co-located with or adjacent
    to gateway stations
  - Telemetry, Tracking and Command (TT&C) Facilities: sites responsible for orbit management and
    health monitoring
  - Supporting Infrastructure: power substations, backup generators, cooling systems, fibre landing
    points, and access roads serving basestation complexes

  Adjacent topics with direct impact are in scope when the connection is explicit.

