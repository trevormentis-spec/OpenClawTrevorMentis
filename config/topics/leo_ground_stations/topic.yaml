# Blocklist — topics explicitly out of scope
blocklist:
  - "GEO satellite operations (except as customer of LEO GSaaS)"
  - "Pure space situational awareness without ground link relevance"
  - "User terminal equipment and residential/commercial customer premises (Starlink dishes, OneWeb user terminals)"
  - "Space segment assets (satellites, inter-satellite links) except where they affect ground station architecture or demand"
  - "Mission Operations Centres (MOCs) unless co-located with ground stations"
  - "Direct-to-handset cellular (AST SpaceMobile, Starlink D2C) except where they compete for spectrum or ground infrastructure"
  - "Consumer electronics"
  - "Digital/cyber risk frameworks for satellite operations (covered by NIST CSF, NTRA regulatory compliance)"

